<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillBridge - Setup Test</title>

  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Supabase JS CDN -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: sans-serif; padding: 2rem; background: #f8fafc; }
    .card { background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 500px; }
    .status { font-weight: bold; color: green; }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect } = React;

  // Insert your project credentials here
  const SUPABASE_URL = "https://bqyzpmzzdqaiixpesgsq.supabase.co";
  const SUPABASE_KEY = "sb_publishable_1jzWfwvAcgy4m0Bu3gsr4Q_zlIbGR53";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function App() {
    const [status, setStatus] = useState("Testing connection to PostgreSQL...");
    const [profiles, setProfiles] = useState([]);

    useEffect(() => {
      async function testConnection() {
        const { data, error } = await supabase.from('profiles').select('*');
        if (error) {
          setStatus("Connection Error: " + error.message);
        } else {
          setStatus("Connected to PostgreSQL successfully!");
          setProfiles(data);
        }
      }
      testConnection();
    }, []);

    return (
      <div className="card">
        <h2>SkillBridge Database Link</h2>
        <p className="status">{status}</p>
        <h3>Registered Profiles:</h3>
        <ul>
          {profiles.map(p => (
            <li key={p.id}>{p.name} — <em>{p.role}</em></li>
          ))}
        </ul>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
